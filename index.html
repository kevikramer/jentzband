<!DOCTYPE html>
<html>
<head>
    <title>Jentz Band</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
</head>
<body>
    <h1>The Jentz Band - Upcoming shows</h1>
    <div id="data-container">Loading shows...</div>

    <script>
        // Gets data from the local CSV file generated by fetch_data.py
        const public_spreadsheet_url = 'jentz_gig_dates_sheet_1.csv';

        function init() {
            Papa.parse(public_spreadsheet_url, {
                download: true,
                header: true,
                complete: showInfo
            });
        }

        function showInfo(results) {
            const data = results.data;
            let html = '<table border="1">';
            
            data.forEach(row => {
                html += '<tr>';
                Object.values(row).forEach(val => {
                    html += `<td>${val}</td>`;
                });
                html += '</tr>';
            });
            
            html += '</table>';
            document.getElementById('data-container').innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', init);

        // Fetch and display the last modified timestamp for the jent gigs CSV file
        async function getTimestamp() {
            const response = await fetch('jentz_gig_dates_sheet_1.csv');
            // Get the "last-modified" date from the file headers
            const lastModified = response.headers.get('Last-Modified');
    
        if (lastModified) {
            const date = new Date(lastModified);
            document.getElementById('timestamp').innerText = `Gig data last synced: ${date.toLocaleString()}`;
        }
}

// Call this inside your init() function or window listener
window.addEventListener('DOMContentLoaded', () => {
    init(); // your existing data fetch
    getTimestamp(); // the new timestamp fetch
});
    </script>
    
    <!-- Timestamp div for displaying last updated date -->
    <p id="timestamp" style="font-style: italic; color: #666;"></p>
    <p><a href="https://docs.google.com/spreadsheets/d/1AA502Nl-wCXRfLE1axXdmCVvTS3jBy_cn_8l7HvFPMU/edit?usp=sharing">Edit gigs (admins only)</a></p>
</body>
</html>
